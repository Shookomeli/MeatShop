{% extends "base.html" %}

{% block title %}ورود به سامانه | واکا پروتئین{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 2rem auto;">
    <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem;">
        <h1 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.35rem;">ورود به سامانه</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
            برای انبارگردانی و تایید مغایرت‌ها با حساب کاربری مجاز وارد شوید.
        </p>

        {% if form.non_field_errors %}
        <div class="form-error" role="alert" style="padding: 0.6rem 0.85rem; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 6px; margin-bottom: 1rem;">
            نام کاربری یا گذرواژه نادرست است.
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label class="form-label" for="id_username">نام کاربری</label>
                <input type="text" name="username" id="id_username" class="form-input" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus dir="ltr">
            </div>
            <div class="form-group">
                <label class="form-label" for="id_password">گذرواژه</label>
                <input type="password" name="password" id="id_password" class="form-input" autocomplete="current-password" required dir="ltr">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">ورود</button>
        </form>
    </div>
</div>
{% endblock %}
